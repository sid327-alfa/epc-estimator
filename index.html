<div class="g" style="margin-bottom:8px"><div><label>Recherche</label><input value="${LQ.replace(/"/g,'&quot;')}" oninput="LQ=this.value;renderLibB()" placeholder="ex. câble, vanne, tube…"></div>
<div><label>Catégorie</label><select onchange="LC=this.value;renderLibB()"><option value="">Toutes</option>${lcats().map(c=>`<option${c==LC?' selected':''}>${c}</option>`).join('')}</select></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button onclick="LQ='';LIB.unshift({c:LC||'Divers',n:'Nouvelle matière',u:'u',p:0});sl();build()">+ Matière</button><button onclick="loadDef()">Charger la bibliothèque de départ</button></div>
<div id="libb"></div><datalist id="cl">${lcats().map(c=>`<option value="${c}">`).join('')}</datalist>
<details style="margin-top:8px"><summary style="cursor:pointer">Importer depuis Excel (copier-coller)</summary><div class="sub" style="margin:6px 0">Collez des lignes « Matière ; Unité ; Prix ; Catégorie (facultatif) », séparées par une tabulation (copie Excel) ou un point-virgule. Une matière déjà présente est mise à jour.</div>
<textarea id="libi" rows="5" style="width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--in);color:var(--tx);font:inherit"></textarea><button class="p" style="margin-top:6px" onclick="impLib()">Importer</button></details><div id="libm" class="sub" style="margin-top:6px"></div>`;renderLibB()}
function renderLibB(){const q=LQ.toLowerCase();let n=0;const r=LIB.map((x,k)=>{if((LC&&x.c!=LC)||(q&&!(x.n+' '+x.c).toLowerCase().includes(q)))return'';n++;
return`<tr><td><input list="cl" value="${x.c}" onchange="LIB[${k}].c=this.value;sl();build()"></td><td><input value="${x.n.replace(/"/g,'&quot;')}" onchange="LIB[${k}].n=this.value;sl();build()"></td><td><input style="width:60px" value="${x.u}" onchange="LIB[${k}].u=this.value;sl();build()"></td><td><input type="number" step="any" style="text-align:right" value="${x.p}" onchange="LIB[${k}].p=+this.value;sl();build()"></td><td><button class="x" onclick="LIB.splice(${k},1);sl();build()">×</button></td></tr>`}).join('');
$('libb').innerHTML=`<div class="sc" style="max-height:420px;overflow-y:auto"><table style="min-width:560px"><thead><tr><th>Catégorie</th><th>Matière</th><th>Unité</th><th>Prix (DA)</th><th></th></tr></thead><tbody>${r}</tbody></table></div><div class="sub" style="margin-top:4px">${n} matière(s) affichée(s) sur ${LIB.length}</div>`}
function loadDef(){const ex=new Set(LIB.map(x=>x.n.toLowerCase()));let n=0;LD().forEach(x=>{if(!ex.has(x.n.toLowerCase())){LIB.push(x);n++}});sl();build();$('libm').textContent=n+' matière(s) ajoutée(s) depuis la bibliothèque de départ.'}
function impLib(){let a=0,u=0;$('libi').value.split('\n').forEach(s=>{const c=s.split(/\t|;/).map(x=>x.trim());if(c.length<3)return;const p=parseFloat(c[2].replace(/\s/g,'').replace(',','.'));if(!c[0]||isNaN(p))return;
const i=LIB.findIndex(x=>x.n.toLowerCase()==c[0].toLowerCase());if(i>=0){LIB[i].u=c[1];LIB[i].p=p;if(c[3])LIB[i].c=c[3];u++}else{LIB.push({c:c[3]||'Divers',n:c[0],u:c[1],p});a++}});
sl();build();$('libm').textContent=a+' ajoutée(s), '+u+' mise(s) à jour.'}
function pickLib(i,j,k){if(k==='')return;S.lots[i].l[j].m=LIB[k].p;save();build()}
async function sv(name,data){const d=window.claude?await claude.use('downloads'):null;if(!d){alert('Téléchargement indisponible dans cette vue.');return}try{await d.save({filename:name,data})}catch(e){if(!e||e.code!='declined')alert('Export impossible : '+((e&&(e.message||e.code))||''))}}
function rows(){const r=[['Corps d’état','Désignation','Unité','Quantité','Rendement (h/unité)','PU matière (DA)','PU engins (DA)','Taux horaire (DA/h)','Heures','MO (DA)','Matières (DA)','Engins (DA)','Total (DA)']];S.lots.forEach(o=>o.l.forEach(l=>{const k=lc(l,o.t);r.push([o.n,l.d,l.u,l.q,l.r,l.m,l.e,o.t,l.q*l.r,k.mo,k.ma,k.en,k.tt])}));return r}
function expC(){sv('estimation_epc.csv','\uFEFF'+rows().map(r=>r.map(v=>String(v).replace(/;/g,',')).join(';')).join('\n'))}
function expX(){if(typeof XLSX=='undefined'){alert('Bibliothèque Excel non chargée.');return}
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows()),'Estimation');
const sy=[['Corps d’état','MO (DA)','Matières (DA)','Engins (DA)','Total (DA)']];S.lots.forEach(o=>{const s=lt(o);sy.push([o.n,s.mo,s.ma,s.en,s.tt])});
XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sy),'Synthèse');
XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Matière','Unité','Prix (DA)'],...LIB.map(x=>[x.n,x.u,x.p])]),'Prix matières');
sv('estimation_epc.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
function expP(){const P=[['WBS Code','WBS Name','Activity ID','Activity Name','Budgeted Labor Units (h)','Budgeted Labor Cost','Budgeted Nonlabor Cost','Budgeted Total Cost']];
S.lots.forEach((o,i)=>o.l.forEach((l,j)=>{const k=lc(l,o.t),w=i+1;P.push([String(w),o.n,'A'+w+String(j+1).padStart(3,'0'),l.d,Math.round(l.q*l.r),Math.round(k.mo),Math.round(k.ma+k.en),Math.round(k.tt)])}));
sv('primavera_p6_activites.csv','\uFEFF'+P.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'))}
try{window.claude&&claude.use('downloads').then(d=>{if(!d)$('exb').style.display='none'})}catch(e){}
let S;try{S=JSON.parse(localStorage.getItem('epc_est'))}catch(e){}if(!S||!S.lots)S=def();
const save=()=>{try{localStorage.setItem('epc_est',JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),f=x=>Math.round(x).toLocaleString('fr-FR');
function lc(l,t){const mo=l.q*l.r*t,ma=l.q*l.m,en=l.q*l.e;return{mo,ma,en,tt:mo+ma+en}}
function lt(o){return o.l.reduce((a,l)=>{const c=lc(l,o.t);return{mo:a.mo+c.mo,ma:a.ma+c.ma,en:a.en+c.en,tt:a.tt+c.tt}},{mo:0,ma:0,en:0,tt:0})}
function build(){
$('par').innerHTML=[['nom','Nom du projet','text'],['fg','Frais généraux (%)'],['al','Aléas (%)'],['bn','Bénéfice (%)'],['tva','TVA (%)']].map(([k,n,t])=>`<div><label>${n}</label><input type="${t||'number'}" step="any" value="${S[k]}" onchange="S.${k}=${t?'this.value':'+this.value'};upd()"></div>`).join('');
$('lots').innerHTML=S.lots.map((o,i)=>`<div class="card"><div class="lh"><b><input style="width:240px;font-weight:700" value="${o.n}" onchange="S.lots[${i}].n=this.value;upd()"></b>
<span>Taux horaire MO (DA/h) <input style="width:90px" type="number" value="${o.t}" onchange="S.lots[${i}].t=+this.value;upd()"></span><span class="t" id="lt${i}"></span>${/tuyau/i.test(o.n)?`<button class="p" onclick="openTP(${i})">+ Depuis rendements tuyauterie</button>`:''}
<button class="x" onclick="if(confirm('Supprimer ce corps d’état ?')){S.lots.splice(${i},1);save();build()}">Supprimer</button></div><div id="tp${i}"></div>
<div class="sc"><table><thead><tr><th>Désignation</th><th>Unité</th><th>Quantité</th><th>Rend. (h/unité)</th><th>PU matière</th><th>PU engins</th><th>MO</th><th>Matières</th><th>Engins</th><th>Total</th><th></th></tr></thead><tbody>
${o.l.map((l,j)=>`<tr><td><input value="${l.d}" onchange="S.lots[${i}].l[${j}].d=this.value;upd()"></td><td><input value="${l.u}" onchange="S.lots[${i}].l[${j}].u=this.value;upd()"></td>
${['q','r','m','e'].map(k=>`<td><input type="number" step="any" style="text-align:right" value="${l[k]}" onchange="S.lots[${i}].l[${j}].${k}=+this.value;upd()">${k=='m'?`<select style="width:74px;font-size:11px;margin-top:2px;padding:2px" onchange="pickLib(${i},${j},this.value)"><option value="">Bibl.</option>${libOpts()}</select>`:''}</td>`).join('')}
<td class="n" id="a${i}_${j}"></td><td class="n" id="b${i}_${j}"></td><td class="n" id="c${i}_${j}"></td><td class="n t" id="d${i}_${j}"></td>
<td><button class="x" onclick="S.lots[${i}].l.splice(${j},1);save();build()">×</button></td></tr>`).join('')}</tbody></table></div>
<button style="margin-top:6px" onclick="S.lots[${i}].l.push(L('Nouvelle ligne','u',0,0,0,0));save();build()">+ Ligne</button></div>`).join('');
renderLib();upd()}
function upd(){let T={mo:0,ma:0,en:0,tt:0};
S.lots.forEach((o,i)=>{o.l.forEach((l,j)=>{const c=lc(l,o.t);$('a'+i+'_'+j).textContent=f(c.mo);$('b'+i+'_'+j).textContent=f(c.ma);$('c'+i+'_'+j).textContent=f(c.en);$('d'+i+'_'+j).textContent=f(c.tt)});
const s=lt(o);$('lt'+i).textContent='Sous-total : '+f(s.tt)+' DA';['mo','ma','en','tt'].forEach(k=>T[k]+=s[k])});
const mx=Math.max(1,...S.lots.map(o=>lt(o).tt));
$('syn').innerHTML=S.lots.map(o=>{const s=lt(o);return`<div class="row"><span>${o.n}</span><div><div class="bar" style="width:${s.tt/mx*100}%"></div></div><span class="t" style="text-align:right">${f(s.tt)}</span></div>`}).join('');
const fg=T.tt*S.fg/100,al=(T.tt+fg)*S.al/100,bn=(T.tt+fg+al)*S.bn/100,ht=T.tt+fg+al+bn,tv=ht*S.tva/100;
const r=[['Main-d’œuvre',T.mo],['Matières',T.ma],['Engins et sous-traitance',T.en],['Coût direct',T.tt],['Frais généraux ('+S.fg+' %)',fg],['Aléas ('+S.al+' %)',al],['Bénéfice ('+S.bn+' %)',bn],['Total HT',ht],['TVA ('+S.tva+' %)',tv]];
$('tot').innerHTML=r.map(([a,b],i)=>`<tr><td${i==3||i==7?' style="font-weight:700"':''}>${a}</td><td class="n${i==3||i==7?' t':''}">${f(b)} DA</td></tr>`).join('')+`<tr><td class="big">Total TTC</td><td class="n big">${f(ht+tv)} DA</td></tr>`;
save()}
function addLot(){S.lots.push({n:'Nouveau corps d’état',t:1200,l:[L('Nouvelle ligne','u',0,0,0,0)]});save();build()}
build();
</script></body></html>
